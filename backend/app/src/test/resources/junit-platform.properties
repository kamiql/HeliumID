# The route coverage census reads a counter every other class in this module writes to, so it
# has to run last. `OrderAnnotation` leaves unannotated classes at the default position and moves
# only the ones that ask, which is exactly one: RouteCoverageTest.
junit.jupiter.testclass.order.default=org.junit.jupiter.api.ClassOrderer$OrderAnnotation

# Parallel execution would run the census while other classes were still recording, and would
# also let two tests truncate the shared database underneath each other.
junit.jupiter.execution.parallel.enabled=false
